# 段1：ランタイム×精度（×デバイス）。python scripts/sweep.py configs/sweep/stage1.yaml --dry_run
name: stage1_runtime_precision
mode: A
base: configs/bench/base.yaml
rounds: 3
cooldown_s: 60
grid:
  - policy.runtime: [torch]
    policy.precision: [fp32, bf16]
  - policy.runtime: [ov]
    policy.device: [CPU, GPU]
    policy.model: [data/models/ov/smolvla-libero-fp16-ov, data/models/ov/smolvla-libero-w8a16-ov]
  # vla.cpp は vla-server を起動するので、server の設定ごと上書きする。
  # scripts/vla_server.sh が VLA_BACKEND に応じて build / build-sycl / build-ov を選び、環境を読む
  # SYCL 版は stage1_sycl.yaml に分けた（GPU の実行のあとに続けると WSL ごと止まったため。docs/decisions.md）
  - policy.runtime: [vlacpp]
    policy.model: [data/models/gguf/smolvla-libero.gguf]
    policy.extra: [{action_dim: 7}]
    server:
      - {binary: scripts/vla_server.sh, gguf: data/models/gguf/smolvla-libero.gguf, env: {VLA_BACKEND: cpu}, expect_backend: CPU}
      - {binary: scripts/vla_server.sh, gguf: data/models/gguf/smolvla-libero.gguf, env: {VLA_BACKEND: ov, GGML_OPENVINO_DEVICE: GPU}, expect_backend: OPENVINO, ready_timeout_s: 900}
exclude: []

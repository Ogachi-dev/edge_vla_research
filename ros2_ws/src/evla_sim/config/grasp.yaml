# 把持判定ノードのパラメータ（docs/track2/32）。データ生成と評価で同じファイルを使う
grasp_judge:
  ros__parameters:
    use_sim_time: true
    world_frame: world
    tcp_frame: tcp
    cube_frame: cube                 # 【要確認】/model/cube/pose の child_frame_id
    gripper_joint: "6"
    cube_size_m: 0.03
    vertical_tol_m: 0.01             # TODO(you): 32章の考え方で決める
    forward_tol_m: 0.01
    yaw_tol_deg: 15.0
    approach_tol_deg: 30.0
    gripper_closed_rad: 0.0          # TODO(you): 31章で確かめた符号と値
    release_open_rad: 0.5
    box_inner_xy_m: [0.12, 0.12]
    box_center_xy_m: [0.2, 0.18]     # 【要確認】箱を毎回動かすなら、episode_runner から更新する仕組みが要る
    rim_z_m: 0.05
    opening_table_csv: ""            # TODO(you): 32章 Step 2 で作った表のパス
    event_log: /tmp/grasp_events.jsonl

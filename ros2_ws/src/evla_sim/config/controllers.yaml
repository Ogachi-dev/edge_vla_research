# lerobot_ws の controllers を上書きする（docs/track2/31 Step 1）。関節名は "1"〜"6"
controller_manager:
  ros__parameters:
    update_rate: ___  # 【穴①】制御周期[Hz]。物理（600Hz）の約数で、30Hz の倍数
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: ["1", "2", "3", "4", "5"]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false

gripper_controller:
  ros__parameters:
    joints: ["6"]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
